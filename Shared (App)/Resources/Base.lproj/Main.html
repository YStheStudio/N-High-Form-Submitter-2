<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">

    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>

<body>
    <img src="../Icon.png" width="128" height="128" alt="N High Form Submitter Icon">
    <p class="platform-ios">設定でN High Form Submitter 2の拡張機能を有効にすることができます。</p>
    <p class="platform-mac state-unknown">拡張機能のセクションでN High Form Submitter 2の拡張機能をオンにすることができます。</p>
    <p class="platform-mac state-on">N High Form Submitter 2の拡張機能が有効になっています。Safariの拡張機能の設定でオフにすることができます。</p>
    <p class="platform-mac state-off">N High Form Submitter 2の拡張機能が無効になっています。Safariの拡張機能の設定でオンにすることができます。</p>
    <button class="platform-mac open-preferences">設定を開いて終了</button>
</body>

</html>
